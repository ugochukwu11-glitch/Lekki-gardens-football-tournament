services:
  - type: web
    name: lekki-gardens-ph1-tournament
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
